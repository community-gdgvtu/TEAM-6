<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — RescueBite</title>
  <link rel="stylesheet" href="/styles.css">
  <script>
    (function() {
      const saved = localStorage.getItem('rescuebite_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', saved);
    })();
  </script>
</head>
<body data-page="login">

  <div class="auth-page-layout">
    <div style="position: absolute; top: 1.5rem; right: 1.5rem;">
      <button class="theme-toggle-btn" id="theme-toggle" onclick="app.toggleTheme()" title="Toggle Theme">🌙 Dark</button>
    </div>

    <div class="auth-box">
      <div style="text-align: center; margin-bottom: 2rem;">
        <a href="/" class="brand-logo" style="justify-content: center; margin-bottom: 0.75rem;">
          <div class="brand-icon">🌱</div>
          <div>RescueBite</div>
        </a>
        <h2 style="font-size: 1.5rem; margin-bottom: 0.25rem;">Sign In to Your Account</h2>
        <p style="font-size: 0.9rem;">Welcome back! Enter your credentials below.</p>
      </div>

      <div class="preset-box">
        <div class="preset-title">Quick Preset Accounts:</div>
        <div style="display: flex; gap: 0.4rem; flex-wrap: wrap;">
          <button type="button" class="btn btn-secondary" style="font-size: 0.75rem; padding: 0.35rem 0.6rem;" onclick="app.fillDemoCredentials('donor')">🟢 Donor</button>
          <button type="button" class="btn btn-secondary" style="font-size: 0.75rem; padding: 0.35rem 0.6rem;" onclick="app.fillDemoCredentials('ngo')">🟡 NGO</button>
          <button type="button" class="btn btn-secondary" style="font-size: 0.75rem; padding: 0.35rem 0.6rem;" onclick="app.fillDemoCredentials('admin')">🟣 Admin</button>
        </div>
      </div>

      <form id="form-login" onsubmit="app.handleLogin(event)">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" class="form-control" id="login-email" required placeholder="name@domain.com">
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" id="login-password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary btn-block" style="padding: 0.8rem;">Sign In</button>
      </form>

      <div class="auth-footer-text">
        Don't have an account? <a href="/register.html" style="font-weight: 700;">Create One</a>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>
  <script src="/app.js"></script>
</body>
</html>
